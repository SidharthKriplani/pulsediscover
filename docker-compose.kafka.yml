# PulseDiscover G34 — real-time streaming scorer over Kafka (local, production-SHAPED; NOT a
# production cluster). Single-node Apache Kafka in KRaft mode (no ZooKeeper).
#
#   docker compose -f docker-compose.kafka.yml up -d kafka                 # start broker
#   docker compose -f docker-compose.kafka.yml up pulsediscover-stream     # start the scorer (consumer)
#   docker compose -f docker-compose.kafka.yml run --rm producer --n 3000 --rate 300   # replay events
#
# The consumer scores each interaction event through the SAME RecommenderService the REST API
# uses, then publishes the recommendation slate to pd.recommendations.
services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: pd-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # Real-time scorer: consumes pd.interactions -> recommends -> produces pd.recommendations
  pulsediscover-stream:
    build: .
    image: pulsediscover-serving:v2
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - PD_DATADIR=/app/data/interim
      - PD_KAFKA_BOOTSTRAP=kafka:29092
    volumes:
      - ./data/interim:/app/data/interim:ro
    command: ["python", "-m", "serving.kafka_stream", "consume", "--k", "20"]
    restart: on-failure

  # On-demand synthetic interaction generator (70% real ALS users, 30% cold-start).
  #   docker compose -f docker-compose.kafka.yml run --rm producer --n 3000 --rate 300
  producer:
    build: .
    image: pulsediscover-serving:v2
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - PD_DATADIR=/app/data/interim
      - PD_KAFKA_BOOTSTRAP=kafka:29092
    volumes:
      - ./data/interim:/app/data/interim:ro
    entrypoint: ["python", "-m", "serving.kafka_stream", "produce"]
    command: ["--n", "2000", "--rate", "300"]
    profiles: ["tools"]
